<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hojak Games</title>
    <meta name="description" content="Hojak Games is an indie game studio.">
    <link rel="canonical" href="https://hojakgames.com/en/">
    <link rel="alternate" hreflang="ko" href="https://hojakgames.com/">
    <link rel="alternate" hreflang="en" href="https://hojakgames.com/en/">
    <link rel="alternate" hreflang="x-default" href="https://hojakgames.com/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hojak Games">
    <meta property="og:title" content="Hojak Games">
    <meta property="og:description" content="Hojak Games is an indie game studio.">
    <meta property="og:url" content="https://hojakgames.com/en/">
    <meta property="og:image" content="https://hojakgames.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Hojak Games logo">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#08404a">

    <link rel="icon" href="../logo_main.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../main.js" defer></script>
  </head>
  <body>
    <header class="top">
      <a class="lang" href="../" hreflang="ko" lang="ko">한국어</a>
    </header>

    <main>
      <img class="logo" src="../logo_main.svg" alt="" width="448" height="451">
      <h1 class="name">Hojak Games</h1>

      <p class="intro">
        Hojak Games is an indie game studio.<br>
        Get in touch at the address below.
      </p>

      <section class="contact" aria-labelledby="contact-label">
        <h2 class="contact-label" id="contact-label">Contact</h2>
        <div class="contact-row">
          <a class="email" href="mailto:contact@hojakgames.com">contact@hojakgames.com</a>
          <button class="copy" type="button" hidden
            data-email="contact@hojakgames.com"
            data-done="Copied"
            data-fail="Couldn't copy. Select the address instead.">Copy address</button>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>© 2026 Hojak Games</p>
    </footer>
  </body>
</html>
